name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Biome lint
        run: bun run lint

      - name: Oxlint
        run: bun run lint:type

      - name: Fitness functions
        run: bun test tests/fitness

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun test:unit

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 147

      - name: Verify Chrome installation
        run: |
          echo "Chrome path: $CHROME_PATH"
          "$CHROME_PATH" --version
          test "$("$CHROME_PATH" --version | grep -o '[0-9]\+' | head -1)" = "147"
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Run integration tests
        run: bun test:integration
        env:
          CI: true
          TEST_TIMEOUT: 60000
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          BROWSER_PILOT_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-artifacts
          path: |
            tests/screenshots/
            ~/.browser-pilot/sessions/*/daemon.log
            ~/.browser-pilot/sessions/*/session.json
            ~/.browser-pilot/sessions/*/recording.json
          retention-days: 7
          if-no-files-found: ignore

  cli:
    name: CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 147

      - name: Verify Chrome installation
        run: |
          echo "Chrome path: $CHROME_PATH"
          "$CHROME_PATH" --version
          test "$("$CHROME_PATH" --version | grep -o '[0-9]\+' | head -1)" = "147"
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Run CLI tests
        run: bun test:cli
        env:
          CI: true
          TEST_TIMEOUT: 60000
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          BROWSER_PILOT_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-failure-artifacts
          path: |
            tests/screenshots/
            ~/.browser-pilot/sessions/*/daemon.log
            ~/.browser-pilot/sessions/*/session.json
            ~/.browser-pilot/sessions/*/recording.json
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build check (type check + verify exports)
        run: |
          bun run typecheck
          bun -e "import('./index.ts')"
          echo "Build check passed!"

      - name: Build package
        run: bun run build

      - name: API Extractor
        run: bun run api:check
