name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# prek + all tools resolve from node_modules via `bun install`.
# CI runs the same scripts as local dev — no special setup needed.
jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run harden:quick

  unit:
    name: Unit & Fitness Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun test tests/unit
      - run: bun test tests/fitness

  browser:
    name: Integration & CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          # WebMCP moved to document.modelContext in Chrome 150. Keep the
          # integration contract on that API generation.
          chrome-version: 150
      - run: bun test tests/integration --timeout 30000
        env:
          CI: true
          # CI must be deterministic and must not leave detached daemons
          # behind. Daemon lifecycle is covered by local-only tests.
          BROWSER_PILOT_NO_DAEMON: '1'
          BROWSER_PILOT_NATIVE_WEBMCP: '1'
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          BROWSER_PILOT_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - run: bun test tests/cli --timeout 30000
        env:
          CI: true
          BROWSER_PILOT_NO_DAEMON: '1'
          BROWSER_PILOT_NATIVE_WEBMCP: '1'
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          BROWSER_PILOT_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Assert CI left no daemon processes or sockets
        if: always()
        run: |
          ! pgrep -f '(^|/)(dist/[d]aemon\.mjs|src/[d]aemon/index\.ts)( |$)' || (echo 'daemon process leaked' && exit 1)
          test -z "$(find "$HOME/.browser-pilot" -type s -name 'daemon.sock' -print -quit 2>/dev/null || true)"
          test -z "$(find "$HOME/.browser-pilot/daemons" -type f \( -name '*.json' -o -name '*.lock' -o -name '*.heartbeat' \) -print -quit 2>/dev/null || true)"
          test -z "$(find "$HOME/.browser-pilot/sessions" -type f -name '*.heartbeat' -print -quit 2>/dev/null || true)"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-artifacts
          path: |
            tests/screenshots/
            ~/.browser-pilot/sessions/*/session.json
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build & API Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run test:package
      - run: bun run api:check
