<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React-like Controlled Form</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { color: #333; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    textarea { resize: vertical; min-height: 80px; }
    .state-display {
      margin-top: 30px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 4px;
      font-family: monospace;
      white-space: pre-wrap;
    }
    .event-log {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
      padding: 10px;
      background: #1a1a2e;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
    }
    .event-log div { margin: 2px 0; }
    .synced { color: #4CAF50; }
    .desynced { color: #f44336; }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
    }
    #clear-log { background: #666; color: white; }
    #submit-btn { background: #4CAF50; color: white; }
    #check-sync { background: #2196F3; color: white; }
  </style>
</head>
<body>
  <h1>React-like Controlled Form</h1>
  <p>This form simulates React controlled inputs with <code>_valueTracker</code> and <code>isTrusted</code> checks.</p>

  <form id="controlled-form">
    <div class="form-group">
      <label for="username">Username (controlled)</label>
      <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="email">Email (controlled)</label>
      <input type="email" id="email" name="email" placeholder="Enter email" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="bio">Bio (controlled textarea)</label>
      <textarea id="bio" name="bio" placeholder="Tell us about yourself" autocomplete="off"></textarea>
    </div>

    <div class="form-group">
      <label for="country">Country (controlled select)</label>
      <select id="country" name="country">
        <option value="">Select a country</option>
        <option value="us">United States</option>
        <option value="uk">United Kingdom</option>
        <option value="ca">Canada</option>
      </select>
    </div>

    <div class="form-group">
      <label for="search">Search (controlled)</label>
      <input type="search" id="search" name="search" placeholder="Type a search term" autocomplete="off">
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" id="newsletter" name="newsletter">
        Subscribe to newsletter (controlled checkbox)
      </label>
    </div>

    <button type="button" id="check-sync">Check State Sync</button>
    <button type="submit" id="submit-btn">Submit</button>
    <button type="button" id="clear-log">Clear Log</button>
  </form>

  <div class="state-display">
    <strong>Internal State:</strong>
    <pre id="state-output">{}</pre>
  </div>

  <div id="sync-status"></div>

  <div class="event-log" id="event-log">
    <div>Event log initialized...</div>
  </div>

  <script>
    // Simulates React-like controlled state
    const state = {
      username: '',
      email: '',
      bio: '',
      country: '',
      search: '',
      newsletter: false,
      eventCount: 0,
      lastEvent: null,
      rejectedEvents: 0
    };

    const eventLog = document.getElementById('event-log');
    const stateOutput = document.getElementById('state-output');
    const syncStatus = document.getElementById('sync-status');

    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.textContent = `[${new Date().toISOString().substr(11, 12)}] ${message}`;
      div.style.color = type === 'error' ? '#f44' : type === 'warn' ? '#ff0' : '#0f0';
      eventLog.appendChild(div);
      eventLog.scrollTop = eventLog.scrollHeight;
    }

    function updateStateDisplay() {
      stateOutput.textContent = JSON.stringify(state, null, 2);
    }

    // --- React _valueTracker simulation ---
    // React uses an internal _valueTracker to detect programmatic value changes.
    // It overrides the native value descriptor so it can compare the "last value"
    // with the current value. If they match, React skips the synthetic event.
    // Automation tools must invalidate the tracker to trigger React's onChange.
    function installValueTracker(element, prop) {
      const descriptor = Object.getOwnPropertyDescriptor(
        Object.getPrototypeOf(element), prop
      );
      if (!descriptor) return;

      let trackerValue = element[prop];

      const tracker = {
        getValue() { return trackerValue; },
        setValue(val) { trackerValue = val; },
        stopTracking() {
          element._valueTracker = undefined;
          Object.defineProperty(element, prop, descriptor);
        }
      };

      Object.defineProperty(element, prop, {
        configurable: true,
        enumerable: true,
        get() {
          return descriptor.get.call(this);
        },
        set(val) {
          trackerValue = val;
          descriptor.set.call(this, val);
        }
      });

      element._valueTracker = tracker;
    }

    // --- isTrusted event rejection ---
    // Some React apps check isTrusted on events and ignore synthetic dispatches.
    // This simulates that pattern.
    function handleInputChange(e) {
      if (!e.isTrusted) {
        state.rejectedEvents++;
        log(`REJECTED untrusted ${e.type} on ${e.target.name} (isTrusted=false)`, 'error');
        // Revert the value to the last known state (simulates React resetting)
        e.target[e.target.tagName === 'TEXTAREA' ? 'value' : 'value'] = state[e.target.name] || '';
        updateStateDisplay();
        return;
      }

      const { name, value } = e.target;
      state[name] = value;
      state.eventCount++;
      state.lastEvent = e.type;

      // Update the tracker's known value (like React would)
      if (e.target._valueTracker) {
        e.target._valueTracker.setValue(value);
      }

      log(`${e.type} on ${name}: "${value}" (event #${state.eventCount})`);
      updateStateDisplay();
    }

    function checkSync() {
      const domValues = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        bio: document.getElementById('bio').value,
        country: document.getElementById('country').value,
        search: document.getElementById('search').value,
        newsletter: document.getElementById('newsletter').checked
      };

      const issues = [];
      for (const [key, domVal] of Object.entries(domValues)) {
        if (domVal !== state[key]) {
          issues.push(`${key}: DOM="${domVal}" vs State="${state[key]}"`);
        }
      }

      if (issues.length === 0) {
        syncStatus.innerHTML = '<p class="synced">State: synced</p>';
        syncStatus.dataset.synced = 'true';
        log('Sync check: PASS - DOM matches state');
        return true;
      } else {
        syncStatus.innerHTML = `<p class="desynced">State: desynced - ${issues.join(', ')}</p>`;
        syncStatus.dataset.synced = 'false';
        log(`Sync check: FAIL - ${issues.join(', ')}`, 'error');
        return false;
      }
    }

    // Install trackers and listeners on text-like inputs
    ['username', 'email', 'bio', 'search'].forEach((id) => {
      var el = document.getElementById(id);
      var prop = el.tagName === 'TEXTAREA' ? 'value' : 'value';
      installValueTracker(el, prop);

      // React's onChange fires on 'input' for text inputs
      el.addEventListener('input', handleInputChange);

      el.addEventListener('change', () => {
        log(`change event on ${id} (after blur typically)`, 'warn');
      });
      el.addEventListener('focus', () => { log(`focus on ${id}`); });
      el.addEventListener('blur', () => { log(`blur on ${id}`); });
    });

    // Select uses 'change' event (React does this too)
    var countryEl = document.getElementById('country');
    countryEl.addEventListener('change', (e) => {
      if (!e.isTrusted) {
        state.rejectedEvents++;
        log('REJECTED untrusted change on country (isTrusted=false)', 'error');
        countryEl.value = state.country || '';
        updateStateDisplay();
        return;
      }
      state.country = countryEl.value;
      state.eventCount++;
      state.lastEvent = 'change';
      log(`change on country: "${countryEl.value}" (event #${state.eventCount})`);
      updateStateDisplay();
    });
    countryEl.addEventListener('focus', () => { log('focus on country'); });

    // Checkbox uses change events
    var newsletterEl = document.getElementById('newsletter');
    newsletterEl.addEventListener('change', (e) => {
      if (!e.isTrusted) {
        state.rejectedEvents++;
        log('REJECTED untrusted change on newsletter (isTrusted=false)', 'error');
        newsletterEl.checked = !!state.newsletter;
        updateStateDisplay();
        return;
      }

      state.newsletter = newsletterEl.checked;
      state.eventCount++;
      state.lastEvent = 'change';
      log(`change on newsletter: ${newsletterEl.checked} (event #${state.eventCount})`);
      updateStateDisplay();
    });
    newsletterEl.addEventListener('focus', () => { log('focus on newsletter'); });

    // Submit handler
    document.getElementById('controlled-form').addEventListener('submit', (e) => {
      e.preventDefault();
      log(`Form submitted with state: ${JSON.stringify(state)}`);
      if (checkSync()) {
        alert(`Form submitted successfully!\n\nState:\n${JSON.stringify(state, null, 2)}`);
      } else {
        alert('ERROR: DOM and state are out of sync!');
      }
    });

    // Check sync button
    document.getElementById('check-sync').addEventListener('click', checkSync);

    // Clear log button
    document.getElementById('clear-log').addEventListener('click', () => {
      eventLog.innerHTML = '<div>Event log cleared...</div>';
    });

    // Initialize
    updateStateDisplay();
    log('Form initialized - _valueTracker active, isTrusted checking enabled');
  </script>
</body>
</html>
