<!DOCTYPE html>
<html lang="en">
<head>
  <title>Fixed Header Test</title>
  <style>
    #header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #333;
      color: white;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }
    #content {
      padding-top: 80px;
    }
    .spacer { height: 2000px; }
    #target-btn {
      padding: 20px 40px;
      font-size: 18px;
    }
    #result { margin: 20px; }
  </style>
</head>
<body>
  <div id="header">Fixed Header</div>
  <div id="content">
    <div class="spacer"></div>
    <button type="button" id="target-btn" onclick="document.getElementById('result').textContent = 'clicked'">Target Button</button>
    <div id="result"></div>
    <div class="spacer"></div>
  </div>
</body>
</html>
