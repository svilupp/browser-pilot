<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 { color: #333; }

    /* Main content behind the overlay */
    .main-content {
      margin-top: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    #main-button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #main-button:hover { background: #43A047; }

    /* Overlay that covers everything */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #overlay.hidden { display: none; }

    .overlay-dialog {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    .overlay-dialog h2 {
      margin: 0 0 10px 0;
      color: #333;
    }
    .overlay-dialog p {
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    #dismiss-overlay {
      padding: 12px 30px;
      font-size: 16px;
      cursor: pointer;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #dismiss-overlay:hover { background: #1976D2; }

    /* Result display */
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 4px;
      display: none;
    }
    #result.visible {
      display: block;
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
      color: #2e7d32;
    }
    #overlay-status {
      margin-top: 20px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Overlay Test</h1>

  <div class="main-content">
    <p>These elements are behind the overlay. Dismiss the overlay first to interact with them.</p>

    <div class="form-group">
      <label for="main-input">Input (behind overlay)</label>
      <input type="text" id="main-input" placeholder="Type something here">
    </div>

    <button type="button" id="main-button">Click Me</button>

    <div id="result"></div>

    <div id="overlay-status">Overlay: visible</div>
  </div>

  <!-- Overlay covering the page -->
  <div id="overlay">
    <div class="overlay-dialog">
      <h2>Welcome</h2>
      <p>This overlay is blocking the content behind it. You must dismiss it before interacting with the page.</p>
      <button type="button" id="dismiss-overlay">Dismiss</button>
    </div>
  </div>

  <script>
    var overlay = document.getElementById('overlay');
    var result = document.getElementById('result');
    var overlayStatus = document.getElementById('overlay-status');

    // Dismiss overlay
    document.getElementById('dismiss-overlay').addEventListener('click', () => {
      overlay.classList.add('hidden');
      overlayStatus.textContent = 'Overlay: dismissed';
    });

    // Main button click
    document.getElementById('main-button').addEventListener('click', () => {
      result.className = 'visible';
      result.textContent = 'Button clicked successfully!';
    });

    // Track input changes
    document.getElementById('main-input').addEventListener('input', (e) => {
      overlayStatus.textContent = `Overlay: dismissed | Input: "${e.target.value}"`;
    });
  </script>
</body>
</html>
