<!DOCTYPE html>
<html lang="en">
<head><title>Modal Outcome</title></head>
<body>
  <h1>Account Settings</h1>
  <button type="button" id="delete-btn">Delete Account</button>
  <div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
    <div style="background:white; margin:100px auto; padding:24px; max-width:400px; border-radius:8px;">
      <h2>Are you sure?</h2>
      <p>This action cannot be undone.</p>
      <button type="button" id="confirm-btn">Confirm Delete</button>
      <button type="button" id="cancel-btn">Cancel</button>
    </div>
  </div>
  <div id="success-msg" style="display:none; background:#4caf50; color:white; padding:12px; margin-top:12px; border-radius:4px;">
    Account deleted successfully
  </div>
  <script>
    const deleteBtn = document.getElementById('delete-btn');
    const modal = document.getElementById('modal-overlay');
    const confirmBtn = document.getElementById('confirm-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const successMsg = document.getElementById('success-msg');

    deleteBtn.addEventListener('click', () => { modal.style.display = 'block'; });
    cancelBtn.addEventListener('click', () => { modal.style.display = 'none'; });
    confirmBtn.addEventListener('click', () => {
      modal.style.display = 'none';
      deleteBtn.style.display = 'none';
      successMsg.style.display = 'block';
    });
  </script>
</body>
</html>
