id: no-cli-import-in-core
language: typescript
rule:
  any:
    - pattern: import $$$FROM from '$$$PATH'
      regex: "cli/"
    - pattern: import $$$FROM from '$$$PATH'
      regex: "daemon/"
message: "Core library code must not import from CLI or daemon modules"
severity: error
files:
  - "src/**/*.ts"
ignores:
  - "src/cli/**"
  - "src/daemon/**"
  - "src/index.ts"
  # These Node-only bridges borrow persisted CLI sessions and host their owner.
  # Portable entry-point
  # import graphs remain guarded by tests/fitness/core-portability.test.ts.
  - "src/adapters/node/observe-session.ts"
  - "src/adapters/node/named-session.ts"
  - "src/adapters/node/owner-actions.ts"
  - "src/adapters/node/owner-action-daemon.ts"
